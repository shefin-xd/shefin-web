<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Shefin</title>
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">SHEFIN ACCOUNT</p>
      <h1>One account for every Shefin app.</h1>
      <p class="intro">Sign in once, then continue securely to Chat, Admin, and future products.</p>
      <form id="login-form">
        <label>Email <input id="email" type="email" autocomplete="email" required /></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="fine-print">Your session is stored in a secure, httpOnly cookie on the Shefin API.</p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
